<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTON 2K25 - Registration Status</title>
    <link rel="stylesheet" href="../../owasp3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        .status-container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 0, 0.1);
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            color: #ffffff;
        }

        .team-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 0, 0.2);
            color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            font-family: 'Share Tech Mono', monospace;
            margin-right: 10px;
        }

        .team-input:focus {
            outline: none;
            border-color: #ffff00;
            box-shadow: 0 0 5px rgba(255, 255, 0, 0.3);
        }

        .submit-btn {
            background: transparent;
            border: 1px solid #ffff00;
            color: #ffff00;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background: #ffff00;
            color: #000;
        }

        .team-details {
            margin-top: 30px;
            display: none;
        }

        .detail-row {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .detail-label {
            color: #ffff00;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 5px;
        }

        .detail-value {
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff;
        }

        .wifi-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 0, 0.2);
        }

        .wifi-credentials {
            display: none;
        }

        .show-wifi-btn {
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 15px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .show-wifi-btn:hover {
            background: #00ffff;
            color: #000;
        }

        .error-message {
            color: #ff4444;
            margin-top: 10px;
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="https://owasp.org/"><img src="https://owasp.org/assets/images/logo.png" class="club-poster" /></a>
            </div>
            <ul class="nav-links">
                <li><a href="/#about-college">Home</a></li>
                <li><a href="/#club-details">OWASP Club</a></li>
                <li><a href="/events">Events</a></li>
                <li><a href="/crypton-2k25">Crypton 2K25</a></li>
                <li><a href="/crypton-2k25/teams">View Teams</a></li>
                <li><a href="/Euphoria-2025">Tech Forge</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <div class="container" style="margin-top: 100px;">
        <h2 class="main-heading">CRYPTON 2K25 - Registration Status</h2>
        
        <div class="status-container">
            <div id="teamInputSection">
                <input type="number" id="teamNumber" class="team-input" placeholder="Enter Team Number" min="1">
                <button id="checkStatus" class="submit-btn">Check Status</button>
                <div id="errorMessage" class="error-message"></div>
            </div>

            <div id="teamDetails" class="team-details">
                <div class="detail-row">
                    <div class="detail-label">Team Number</div>
                    <div id="displayTeamNumber" class="detail-value"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Team Leader</div>
                    <div id="leaderName" class="detail-value"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Registration Number</div>
                    <div id="regNo" class="detail-value"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Problem Statement</div>
                    <div id="problemStatement" class="detail-value"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Registration Time</div>
                    <div id="regTime" class="detail-value"></div>
                </div>

                <div class="wifi-section">
                    <div class="detail-label">WiFi Credentials</div>
                    <button id="showWifiBtn" class="show-wifi-btn">Click to Show</button>
                    <div id="wifiCredentials" class="wifi-credentials">
                        <div class="detail-row">
                            <div class="detail-label">WiFi ID</div>
                            <div id="wifiId" class="detail-value"></div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">WiFi Password</div>
                            <div id="wifiPassword" class="detail-value"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB setup
        let db;
        const dbName = "CryptonDB";
        const request = indexedDB.open(dbName, 1);

        request.onerror = (event) => {
            console.error("Database error:", event.target.error);
        };

        request.onupgradeneeded = (event) => {
            db = event.target.result;
            if (!db.objectStoreNames.contains("teamData")) {
                db.createObjectStore("teamData", { keyPath: "teamNumber" });
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            checkStoredTeam();
        };

        // Check if team is already stored
        async function checkStoredTeam() {
            const transaction = db.transaction(["teamData"], "readonly");
            const store = transaction.objectStore("teamData");
            const request = store.getAll();

            request.onsuccess = (event) => {
                const storedTeam = event.target.result[0];
                if (storedTeam) {
                    document.getElementById('teamNumber').value = storedTeam.teamNumber;
                    document.getElementById('teamNumber').disabled = true;
                    fetchTeamDetails(storedTeam.teamNumber);
                }
            };
        }

        // Store team in IndexedDB
        function storeTeam(teamData) {
            const transaction = db.transaction(["teamData"], "readwrite");
            const store = transaction.objectStore("teamData");
            store.put(teamData);
        }

        // Fetch team details
        async function fetchTeamDetails(teamNumber) {
            try {
                const response = await fetch('https://owaspkare.vercel.app/api/teams');
                const data = await response.json();
                
                if (!data.success) throw new Error('Failed to fetch team details');

                const team = data.data.find(t => t.teamNumber === parseInt(teamNumber));
                
                if (!team) {
                    document.getElementById('errorMessage').textContent = 'Team not found';
                    document.getElementById('teamDetails').style.display = 'none';
                    return;
                }

                // Store team data if not already stored
                if (!document.getElementById('teamNumber').disabled) {
                    storeTeam(team);
                    document.getElementById('teamNumber').disabled = true;
                }

                // Display team details
                document.getElementById('displayTeamNumber').textContent = team.teamNumber;
                document.getElementById('leaderName').textContent = team.leaderName;
                document.getElementById('regNo').textContent = team.leaderRegNo;
                document.getElementById('problemStatement').textContent = team.problemStatement;
                document.getElementById('regTime').textContent = team.registeredAt;
                document.getElementById('wifiId').textContent = team.wifi_id || 'Not available';
                document.getElementById('wifiPassword').textContent = team.wifi_password || 'Not available';

                document.getElementById('teamDetails').style.display = 'block';
                document.getElementById('errorMessage').textContent = '';

            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Error fetching team details';
                console.error('Error:', error);
            }
        }

        // Event Listeners
        document.getElementById('checkStatus').addEventListener('click', () => {
            const teamNumber = document.getElementById('teamNumber').value;
            if (!teamNumber) {
                document.getElementById('errorMessage').textContent = 'Please enter a team number';
                return;
            }
            fetchTeamDetails(teamNumber);
        });

        document.getElementById('showWifiBtn').addEventListener('click', function() {
            const wifiCredentials = document.getElementById('wifiCredentials');
            const isHidden = wifiCredentials.style.display === 'none' || !wifiCredentials.style.display;
            wifiCredentials.style.display = isHidden ? 'block' : 'none';
            this.textContent = isHidden ? 'Hide Credentials' : 'Click to Show';
        });

        // Mobile menu functionality
        const burger = document.querySelector('.burger');
        const nav = document.querySelector('.nav-links');
        const navLinks = document.querySelectorAll('.nav-links li');

        burger.addEventListener('click', () => {
            nav.classList.toggle('nav-active');
            navLinks.forEach((link, index) => {
                if (link.style.animation) {
                    link.style.animation = '';
                } else {
                    link.style.animation = `navLinkFade 0.5s ease forwards ${index / 7 + 0.3}s`;
                }
            });
            burger.classList.toggle('toggle');
        });
    </script>
</body>
</html>
